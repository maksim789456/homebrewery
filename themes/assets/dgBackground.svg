<svg xmlns="http://www.w3.org/2000/svg" width="1229" height="1589" viewBox="0 0 1229 1589">
<defs>

  <!-- warm paper base -->
  <linearGradient id="base" x2="0" y2="1">
    <stop stop-color="#eee1c5"/>
    <stop offset="0.45" stop-color="#f4ead5"/>
    <stop offset="1" stop-color="#e5d1ae"/>
  </linearGradient>

  <!-- uneven old paper variation -->
  <filter id="texture">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="5" seed="12"/>
    <feColorMatrix values="
      1 0 0 0 0.72
      0 1 0 0 0.62
      0 0 1 0 0.45
      0 0 0 .18 0"/>
  </filter>

  <filter id="fineGrain">
    <feTurbulence type="fractalNoise" baseFrequency="0.45" numOctaves="3" seed="5"/>
    <feColorMatrix values="
      1 0 0 0 .65
      0 1 0 0 .55
      0 0 1 0 .4
      0 0 0 .09 0"/>
  </filter>

  <filter id="soft">
    <feGaussianBlur stdDeviation="45"/>
  </filter>

  <radialGradient id="edge">
    <stop stop-color="#b49a70" stop-opacity=".0"/>
    <stop offset="1" stop-color="#8d7555" stop-opacity=".55"/>
  </radialGradient>

</defs>


<!-- paper -->
<rect width="1229" height="1589" fill="url(#base)"/>

<!-- large natural paper blotches -->
<g filter="url(#soft)" opacity=".55">

  <ellipse cx="80" cy="260" rx="180" ry="300" fill="#c7ad82"/>
  <ellipse cx="180" cy="900" rx="220" ry="400" fill="#d0b58a"/>

  <ellipse cx="1140" cy="1180" rx="260" ry="360" fill="#a68d69"/>
  <ellipse cx="1080" cy="1380" rx="180" ry="250" fill="#92795a"/>

  <ellipse cx="700" cy="40" rx="250" ry="80" fill="#bca37c"/>

</g>


<!-- dirty corners like scanned paper -->
<path d="M0 0 Q140 80 80 250 Q40 420 0 520Z"
      fill="#b49365" opacity=".01"/>

<path d="M1229 1050 Q1060 1100 1000 1280 Q1100 1450 1229 1510Z"
      fill="#8e7658" opacity=".01"/>


<!-- subtle fiber texture -->
<rect width="1229" height="1589" filter="url(#texture)"/>

<!-- fine paper grain -->
<rect width="1229" height="1589" filter="url(#fineGrain)"/>

</svg>
