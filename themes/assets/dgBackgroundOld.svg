<svg xmlns="http://www.w3.org/2000/svg" width="1229" height="1589" viewBox="0 0 1229 1589">
<defs>

<linearGradient id="paper" x2="0" y2="1">
  <stop stop-color="#eadabd"/>
  <stop offset=".5" stop-color="#f2e7d2"/>
  <stop offset="1" stop-color="#e8d7b8"/>
</linearGradient>

<filter id="paperNoise">
  <feTurbulence type="fractalNoise" baseFrequency=".025" numOctaves="4" seed="21"/>
  <feColorMatrix values="
  1 0 0 0 .75
  0 1 0 0 .65
  0 0 1 0 .45
  0 0 0 .12 0"/>
</filter>

<filter id="grain">
  <feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="2" seed="9"/>
  <feColorMatrix values="
  1 0 0 0 .7
  0 1 0 0 .6
  0 0 1 0 .45
  0 0 0 .07 0"/>
</filter>

<filter id="blur">
  <feGaussianBlur stdDeviation="70"/>
</filter>

</defs>

<!-- clean warm paper -->
<rect width="1229" height="1589" fill="url(#paper)"/>


<!-- subtle old paper discoloration -->
<g filter="url(#blur)" opacity=".22">

  <!-- left aged edge -->
  <path d="M0 0 C180 180 120 450 60 650 C130 900 40 1200 0 1500Z"
        fill="#bfa47b"/>

  <!-- bottom right aged area, softer -->
  <ellipse cx="1110" cy="1380" rx="260" ry="220"
           fill="#b49a72"/>

  <!-- tiny top weathering -->
  <ellipse cx="240" cy="80" rx="260" ry="70"
           fill="#cdb58e"/>

</g>


<!-- faint paper variation -->
<rect width="1229" height="1589" filter="url(#paperNoise)"/>

<!-- fine fibers -->
<rect width="1229" height="1589" filter="url(#grain)"/>


<!-- very light edge darkening -->
<rect x="0" y="0" width="1229" height="1589"
      fill="none"
      stroke="#a58b68"
      stroke-width="10"
      opacity=".12"/>

</svg>
